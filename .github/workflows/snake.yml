name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0E0D1B,#1E1B4B,#4338CA,#6366F1,#38BDF8&color_background=#07070C
            dist/snake-light.svg?color_snake=#6366F1&color_dots=#F8FAFC,#E0E7FF,#C7D2FE,#818CF8,#4F46E5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
