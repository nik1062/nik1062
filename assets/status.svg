<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="Deployments: nik1062-portfolio.vercel.app, RecoverForge, CodeMeet AI, MediSync (ClinicOS), ColdMailForge, Metro Mirchi 2.0 are live; Vayu and VedaAI are being built">
  <defs>
    <clipPath id="card"><rect width="900" height="392" rx="18"/></clipPath>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#3BE0A0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3BE0A0" stop-opacity=".07"/>
