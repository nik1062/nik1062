    <g transform="translate(700, 6)"><rect class="equalizer" x="0" y="0" width="4.5" height="22" style="animation-delay:0s"/><rect class="equalizer" x="7" y="0" width="4.5" height="22" style="animation-delay:.2s"/><rect class="equalizer" x="14" y="0" width="4.5" height="22" style="animation-delay:.4s"/><rect class="equalizer" x="21" y="0" width="4.5" height="22" style="animation-delay:.6s"/><rect class="equalizer" x="28" y="0" width="4.5" height="22" style="animation-delay:.8s"/><rect class="equalizer" x="35" y="0" width="4.5" height="22" style="animation-delay:1s"/></g>
    <rect x="806" y="8" width="70" height="22" rx="6" fill="#06B6D4" fill-opacity="0.16" stroke="#06B6D4" stroke-opacity="0.4"/>
    <text x="841" y="23" text-anchor="middle" class="mono tag" fill="#38BDF8">LIVE</text>
  </g></g>
  <line x1="18" y1="99" x2="882" y2="99" stroke="#16142A"/>

