<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="Deployments: Portfolio, FocusFlow Flutter App, SABAS Bus Tracking, RecoverForge, MediSync Mobile, ColdMailForge live; FridgeFriend and EduHub building">
  <defs>
    <clipPath id="card"><rect width="900" height="392" rx="20"/></clipPath>
    
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#312E81" opacity="0.4"/>
    </pattern>

    <radialGradient id="statusGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .host { font-size: 13.5px; fill: #F1F5F9; font-weight: 600; }
    .what { font-size: 11.5px; fill: #94A3B8; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }

    .row { animation: inRow 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes inRow { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulseDot 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    @keyframes pulseDot { 0% { transform: scale(1); opacity: 0.8; } 80%, 100% { transform: scale(3.2); opacity: 0; } }

    .equalizer { transform-box: fill-box; transform-origin: bottom; animation: eqBeat 1.8s ease-in-out infinite; fill: url(#barGrad); }
    @keyframes eqBeat { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

    .buildAnim { transform-box: fill-box; transform-origin: left; animation: buildBar 3s ease-in-out infinite; }
    @keyframes buildBar { 0% { transform: scaleX(0.12); } 70%, 100% { transform: scaleX(1); opacity: 0; } }

    .sheenAnim { animation: sheenMove 6s linear infinite; }
    @keyframes sheenMove { from { transform: translateY(-70px); } to { transform: translateY(400px); } }
  </style>

  <!-- Background -->
  <g clip-path="url(#card)">
    <rect width="900" height="392" fill="#07070C"/>
    <rect width="900" height="392" fill="url(#dotGrid)"/>
    <rect width="900" height="392" fill="url(#statusGlow)"/>
    <rect width="900" height="52" fill="#0E0D1B"/>
    <rect class="sheenAnim" x="0" y="0" width="900" height="60" fill="url(#sheen)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="390.5" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#1E1B4B" stroke-width="1.2"/>

  <!-- Top Title Bar -->
  <circle class="pulse" cx="26" cy="26" r="4.5" fill="#38BDF8"/><circle cx="26" cy="26" r="4.5" fill="#38BDF8"/>
  <text x="42" y="31" class="sans" font-size="14.5" font-weight="700" fill="#F8FAFC">ACTIVE MOBILE APPS &amp; BACKEND SYSTEMS</text>
  <text x="420" y="31" class="mono" font-size="12" fill="#818CF8">· 6 LIVE · 2 BUILDING</text>
  <text x="876" y="31" text-anchor="end" class="mono" font-size="12" fill="#94A3B8">nik1062-portfolio.vercel.app ↗</text>

  <!-- Row 1: FocusFlow Mobile App -->
  <g transform="translate(0, 58)"><g class="row" style="animation-delay: 0.05s">
