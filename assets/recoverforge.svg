<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <clipPath id="card"><rect width="600" height="340" rx="16"/></clipPath>
    <radialGradient id="aurora" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <g clip-path="url(#card)">
    <rect width="600" height="340" fill="#07070C"/>
    <rect width="600" height="340" fill="url(#aurora)"/>
    
    <!-- Window Bar -->
    <rect width="600" height="38" fill="#0E0D1B"/>
    <circle cx="24" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="39" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="4.5" fill="#10B981"/>
    
    <rect x="170" y="8" width="260" height="22" rx="11" fill="#07070C" stroke="#2E1065" stroke-width="1.2"/>
    <text x="300" y="23" text-anchor="middle" class="mono" font-size="11" fill="#A5B4FC">recoverforge.app/pipeline</text>
    
    <!-- Top Stats Bar -->
    <g transform="translate(24, 52)">
      <rect width="168" height="58" rx="10" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="14" y="24" class="sans" font-size="11" fill="#94A3B8">AI Root Cause Engine</text>
      <text x="14" y="46" class="sans" font-size="15" font-weight="700" fill="#38BDF8">GPT-4o-mini</text>

      <rect x="188" y="0" width="170" height="58" rx="10" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="202" y="24" class="sans" font-size="11" fill="#94A3B8">HMAC Signature</text>
      <text x="202" y="46" class="sans" font-size="14" font-weight="700" fill="#E2E8F0">SHA-256 Verified</text>

      <rect x="378" y="0" width="174" height="58" rx="10" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="392" y="24" class="sans" font-size="11" fill="#94A3B8">Recovery Payment Link</text>
      <text x="392" y="46" class="sans" font-size="15" font-weight="700" fill="#C084FC">48h Active Link</text>
    </g>

    <!-- Terminal / Pipeline Visual -->
    <g transform="translate(24, 124)">
      <rect width="552" height="190" rx="10" fill="#07070C" stroke="#1E1B4B" stroke-width="1.2"/>
      <rect width="552" height="28" rx="10" fill="#0E0D1B"/>
      <text x="16" y="19" class="mono" font-size="11" fill="#818CF8">⚡ EVENT_BUS: payment.failed received</text>

      <!-- Code / Pipeline items -->
      <text x="16" y="52" class="mono" font-size="11.5" fill="#94A3B8">[00:01.02] <tspan fill="#38BDF8">WEBHOOK_IN:</tspan> event_id=evnt_9x28fa, amount=INR 4,999</text>
      <text x="16" y="74" class="mono" font-size="11.5" fill="#94A3B8">[00:01.18] <tspan fill="#818CF8">IDEMPOTENCY:</tspan> redis.atomic_lock acquired, 0 duplicate delivery</text>
      <text x="16" y="96" class="mono" font-size="11.5" fill="#94A3B8">[00:01.64] <tspan fill="#C084FC">AI_INSPECT:</tspan> failure="bank_timeout" -> follow_up="immediate"</text>
      <text x="16" y="118" class="mono" font-size="11.5" fill="#94A3B8">[00:02.10] <tspan fill="#F59E0B">RAZORPAY_API:</tspan> payment_link.created (plink_81729)</text>
      <text x="16" y="140" class="mono" font-size="11.5" fill="#94A3B8">[00:02.45] <tspan fill="#34D399">DISPATCH:</tspan> personalized recovery email sent via AWS SES</text>

      <!-- Progress Pill -->
      <rect x="16" y="154" width="520" height="22" rx="6" fill="#0E0D1B"/>
      <rect x="16" y="154" width="390" height="22" rx="6" fill="url(#neon)" opacity="0.3"/>
      <text x="24" y="169" class="mono" font-size="10.5" fill="#38BDF8">● Follow-up Pipeline: Step 1 Sent · Step 2 (+3d) Queued · Auto-halts on capture</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="338.5" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
