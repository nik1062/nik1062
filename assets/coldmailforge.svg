<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <clipPath id="card"><rect width="600" height="340" rx="16"/></clipPath>
    <radialGradient id="aurora" cx="15%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <g clip-path="url(#card)">
    <rect width="600" height="340" fill="#07070C"/>
    <rect width="600" height="340" fill="url(#aurora)"/>
    
    <!-- Window Bar -->
    <rect width="600" height="38" fill="#0E0D1B"/>
    <circle cx="24" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="39" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="4.5" fill="#10B981"/>
    
    <rect x="170" y="8" width="260" height="22" rx="11" fill="#07070C" stroke="#2E1065" stroke-width="1.2"/>
    <text x="300" y="23" text-anchor="middle" class="mono" font-size="11" fill="#A5B4FC">coldmailforge.com/campaigns</text>
    
    <!-- Metric Row -->
    <g transform="translate(24, 52)">
      <rect width="128" height="54" rx="8" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="12" y="22" class="sans" font-size="10" fill="#94A3B8">Deliverability</text>
      <text x="12" y="44" class="sans" font-size="16" font-weight="700" fill="#38BDF8">99.4%</text>

      <rect x="140" y="0" width="128" height="54" rx="8" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="152" y="22" class="sans" font-size="10" fill="#94A3B8">Open Rate</text>
      <text x="152" y="44" class="sans" font-size="16" font-weight="700" fill="#818CF8">64.2%</text>

      <rect x="280" y="0" width="128" height="54" rx="8" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="292" y="22" class="sans" font-size="10" fill="#94A3B8">Reply Rate</text>
      <text x="292" y="44" class="sans" font-size="16" font-weight="700" fill="#C084FC">28.5%</text>

      <rect x="420" y="0" width="132" height="54" rx="8" fill="#0E0D1B" stroke="#1E1B4B" stroke-width="1.2"/>
      <text x="432" y="22" class="sans" font-size="10" fill="#94A3B8">Credit Wallet</text>
      <text x="432" y="44" class="sans" font-size="14" font-weight="700" fill="#F59E0B">Razorpay ⚡</text>
    </g>

    <!-- Editor Mockup -->
    <g transform="translate(24, 118)">
      <rect width="552" height="194" rx="10" fill="#07070C" stroke="#1E1B4B" stroke-width="1.2"/>
      <rect width="552" height="28" rx="10" fill="#0E0D1B"/>
      <text x="16" y="18" class="mono" font-size="11" fill="#38BDF8">● AI Cold Email Generator (Context Enriched)</text>

      <!-- Email preview -->
      <g transform="translate(16, 42)">
        <text x="0" y="12" class="mono" font-size="11" fill="#94A3B8">Subject: <tspan fill="#F8FAFC">Engineering roadmap alignment at {{company}}</tspan></text>
        <line x1="0" y1="22" x2="520" y2="22" stroke="#16142A"/>

        <text x="0" y="42" class="sans" font-size="11" fill="#CBD5E1">Hi {{firstName}}, loved your team's recent transition to event-driven webhooks.</text>
        <text x="0" y="62" class="sans" font-size="11" fill="#CBD5E1">We built an automated recovery layer for failed transactions that boosted captured revenue by 24%.</text>
        <text x="0" y="82" class="sans" font-size="11" fill="#CBD5E1">Would you be open to a 5-minute walkthrough of our interactive benchmark?</text>
      </g>

      <!-- Status badges -->
      <g transform="translate(16, 154)">
        <rect width="160" height="24" rx="6" fill="#3B82F6" fill-opacity="0.14" stroke="#3B82F6" stroke-opacity="0.3"/>
        <text x="12" y="16" class="mono" font-size="10" fill="#60A5FA">🔒 OTP Auth Verified</text>

        <rect x="170" y="0" width="170" height="24" rx="6" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.3"/>
        <text x="182" y="16" class="mono" font-size="10" fill="#34D399">💳 Razorpay Checkout Hook</text>

        <rect x="350" y="0" width="170" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.3"/>
        <text x="362" y="16" class="mono" font-size="10" fill="#C084FC">⚡ Dynamic Template Engine</text>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="338.5" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
