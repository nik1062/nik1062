<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <clipPath id="card"><rect width="600" height="340" rx="16"/></clipPath>
    <radialGradient id="aurora" cx="20%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="timerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <g clip-path="url(#card)">
    <rect width="600" height="340" fill="#07070C"/>
    <rect width="600" height="340" fill="url(#aurora)"/>
    
    <!-- Window Bar -->
    <rect width="600" height="38" fill="#0E0D1B"/>
    <circle cx="24" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="39" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="4.5" fill="#10B981"/>
    
    <rect x="170" y="8" width="260" height="22" rx="11" fill="#07070C" stroke="#2E1065" stroke-width="1.2"/>
    <text x="300" y="23" text-anchor="middle" class="mono" font-size="11" fill="#A5B4FC">flutter run -d mobile (FocusFlow)</text>
    
    <!-- Content: Left Mobile Screen Mockup -->
    <g transform="translate(36, 52)">
      <!-- Phone Bezel -->
      <rect width="180" height="262" rx="20" fill="#0E0D1B" stroke="url(#phoneBorder)" stroke-width="1.5"/>
      <!-- Dynamic Island / Speaker -->
      <rect x="65" y="8" width="50" height="10" rx="5" fill="#07070C"/>
      
      <!-- App Header -->
      <text x="20" y="38" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">FocusFlow ⚡</text>
      <rect x="110" y="26" width="54" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="137" y="38" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#FBBF24">14d 🔥</text>

      <!-- Pomodoro Radial Display -->
      <circle cx="90" cy="98" r="42" fill="none" stroke="#1E1B4B" stroke-width="6"/>
      <circle cx="90" cy="98" r="42" fill="none" stroke="url(#timerRing)" stroke-width="6" stroke-dasharray="264" stroke-dashoffset="66" stroke-linecap="round"/>
      <text x="90" y="96" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#F8FAFC">25:00</text>
      <text x="90" y="112" text-anchor="middle" class="sans" font-size="8" fill="#38BDF8">DEEP WORK</text>

      <!-- Streak Analytics Chart Bar -->
      <g transform="translate(18, 160)">
        <text x="0" y="0" class="sans" font-size="9" font-weight="600" fill="#94A3B8">Weekly Focus Analytics</text>
        <rect x="0" y="12" width="16" height="42" rx="3" fill="#1E1B4B"/>
        <rect x="21" y="22" width="16" height="32" rx="3" fill="#1E1B4B"/>
        <rect x="42" y="8" width="16" height="46" rx="3" fill="#38BDF8"/>
        <rect x="63" y="16" width="16" height="38" rx="3" fill="#8B5CF6"/>
        <rect x="84" y="28" width="16" height="26" rx="3" fill="#1E1B4B"/>
        <rect x="105" y="4" width="16" height="50" rx="3" fill="#06B6D4"/>
        <rect x="126" y="14" width="16" height="40" rx="3" fill="#A855F7"/>
      </g>

      <!-- Bottom Navigation Bar -->
      <rect x="10" y="228" width="160" height="24" rx="8" fill="#16142A"/>
      <text x="90" y="244" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">Timer · Analytics · Streaks</text>
    </g>

    <!-- Content: Right Technical Highlights -->
    <g transform="translate(236, 52)">
      <rect width="330" height="262" rx="10" fill="#07070C" stroke="#1E1B4B" stroke-width="1.2"/>
      <rect width="330" height="32" rx="10" fill="#0E0D1B"/>
      <text x="16" y="21" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">📱 Flutter Mobile Architecture</text>
      <rect x="236" y="7" width="80" height="18" rx="9" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4"/>
      <text x="276" y="20" text-anchor="middle" class="mono" font-size="8.5" fill="#38BDF8">CROSS-PLATFORM</text>

      <g transform="translate(16, 46)">
        <rect width="298" height="58" rx="6" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="12" y="20" class="mono" font-size="10" fill="#38BDF8">State Management: Riverpod</text>
        <text x="12" y="36" class="sans" font-size="11" fill="#CBD5E1">Predictable reactive state, modular providers</text>
        <text x="12" y="50" class="mono" font-size="8.5" fill="#94A3B8">0 State Leaks · Smooth 60 FPS transitions</text>
      </g>

      <g transform="translate(16, 114)">
        <rect width="298" height="58" rx="6" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="12" y="20" class="mono" font-size="10" fill="#A855F7">Storage: SQLite &amp; Drift ORM</text>
        <text x="12" y="36" class="sans" font-size="11" fill="#CBD5E1">Offline-first local persistence for sessions &amp; logs</text>
        <text x="12" y="50" class="mono" font-size="8.5" fill="#94A3B8">Instant load times without internet dependency</text>
      </g>

      <g transform="translate(16, 182)">
        <rect width="298" height="58" rx="6" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="12" y="20" class="mono" font-size="10" fill="#F59E0B">Gamification &amp; Local Notifications</text>
        <text x="12" y="36" class="sans" font-size="11" fill="#CBD5E1">Streak locks, achievement badges, audio alarms</text>
        <text x="12" y="50" class="mono" font-size="8.5" fill="#34D399">Built for Android &amp; iOS production deployment</text>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="338.5" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
