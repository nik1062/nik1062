<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <clipPath id="card"><rect width="600" height="340" rx="16"/></clipPath>
    <radialGradient id="aurora" cx="80%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .pulseRadar { transform-origin: 105px 120px; animation: radar 2s ease-out infinite; }
    @keyframes radar { 0% { r: 6px; opacity: 1; } 100% { r: 28px; opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="600" height="340" fill="#07070C"/>
    <rect width="600" height="340" fill="url(#aurora)"/>
    
    <!-- Window Bar -->
    <rect width="600" height="38" fill="#0E0D1B"/>
    <circle cx="24" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="39" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="19" r="4.5" fill="#10B981"/>
    
    <rect x="150" y="8" width="300" height="22" rx="11" fill="#07070C" stroke="#2E1065" stroke-width="1.2"/>
    <text x="300" y="23" text-anchor="middle" class="mono" font-size="11" fill="#FBBF24">🏆 First Prize Winner — NEURA '25 AI Hackathon</text>
    
    <!-- Left: GPS Map & Geofence Visualizer -->
    <g transform="translate(24, 52)">
      <rect width="260" height="262" rx="10" fill="#07070C" stroke="#1E1B4B" stroke-width="1.2"/>
      <rect width="260" height="32" rx="10" fill="#0E0D1B"/>
      <text x="14" y="21" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">📍 Live Fleet Transit Map</text>
      <rect x="186" y="7" width="60" height="18" rx="9" fill="#10B981" fill-opacity="0.15"/>
      <text x="216" y="20" text-anchor="middle" class="mono" font-size="9" fill="#34D399">GPS ACTIVE</text>

      <!-- Map Grid Lines -->
      <line x1="20" y1="80" x2="240" y2="80" stroke="#16142A" stroke-width="1"/>
      <line x1="20" y1="130" x2="240" y2="130" stroke="#16142A" stroke-width="1"/>
      <line x1="20" y1="180" x2="240" y2="180" stroke="#16142A" stroke-width="1"/>
      <line x1="80" y1="44" x2="80" y2="240" stroke="#16142A" stroke-width="1"/>
      <line x1="160" y1="44" x2="160" y2="240" stroke="#16142A" stroke-width="1"/>

      <!-- Route Polyline -->
      <path d="M 40 180 Q 90 140 105 120 T 220 70" fill="none" stroke="url(#routeLine)" stroke-width="3" stroke-linecap="round"/>

      <!-- Geofence Pulse on Bus -->
      <circle class="pulseRadar" cx="105" cy="120" r="10" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="105" cy="120" r="7" fill="#38BDF8"/>
      <text x="118" y="116" class="mono" font-size="9" font-weight="700" fill="#38BDF8">Bus #12</text>
      <text x="118" y="128" class="mono" font-size="8" fill="#94A3B8">Speed: 42 km/h</text>

      <!-- Destination Pin -->
      <circle cx="220" cy="70" r="6" fill="#10B981"/>
      <text x="175" y="60" class="mono" font-size="8.5" fill="#34D399">Pickup Point B</text>

      <!-- Smart Alert Notification Pill -->
      <g transform="translate(14, 206)">
        <rect width="232" height="44" rx="8" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="10" y="18" class="sans" font-size="10" font-weight="700" fill="#FBBF24">🔔 10-Min Geofence Alert</text>
        <text x="10" y="34" class="sans" font-size="9" fill="#E2E8F0">Bus reaching your stop in 8m. Step out!</text>
      </g>
    </g>

    <!-- Right: Technical Details & Metrics -->
    <g transform="translate(300, 52)">
      <rect width="276" height="262" rx="10" fill="#07070C" stroke="#1E1B4B" stroke-width="1.2"/>
      <rect width="276" height="32" rx="10" fill="#0E0D1B"/>
      <text x="14" y="21" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">⚡ System Architecture &amp; Impact</text>

      <g transform="translate(14, 46)">
        <rect width="248" height="58" rx="6" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="12" y="20" class="mono" font-size="10" fill="#38BDF8">Flutter Mobile App (Students &amp; Parents)</text>
        <text x="12" y="36" class="sans" font-size="11" fill="#CBD5E1">Live GPS telematics, live ETA calculation</text>
        <text x="12" y="50" class="mono" font-size="8.5" fill="#34D399">Push notifications before bus arrival</text>
      </g>

      <g transform="translate(14, 114)">
        <rect width="248" height="58" rx="6" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="12" y="20" class="mono" font-size="10" fill="#F59E0B">Hackathon Honors: 1st / 25 Teams</text>
        <text x="12" y="36" class="sans" font-size="11" fill="#CBD5E1">NEURA '25 AI Hackathon First Prize</text>
        <text x="12" y="50" class="mono" font-size="8.5" fill="#818CF8">Aligned with UN SDG-4 (Safe Student Transit)</text>
      </g>

      <g transform="translate(14, 182)">
        <rect width="248" height="58" rx="6" fill="#0E0D1B" stroke="#2E1065"/>
        <text x="12" y="20" class="mono" font-size="10" fill="#C084FC">Admin Fleet Telematics &amp; Security</text>
        <text x="12" y="36" class="sans" font-size="11" fill="#CBD5E1">Central monitoring dashboard &amp; driver app</text>
        <text x="12" y="50" class="mono" font-size="8.5" fill="#94A3B8">Emergency SOS &amp; route deviation detector</text>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="338.5" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
