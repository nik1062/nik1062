<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Nikunj Kumar — Mobile & Full Stack Developer (Flutter, Android, Node.js, React, PostgreSQL)">
  <defs>
    <!-- Constellation Dot Matrix -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#312E81" opacity="0.6"/>
      <circle cx="16" cy="16" r="0.8" fill="#4338CA" opacity="0.3"/>
    </pattern>

    <!-- Aurora Mesh Gradients -->
    <radialGradient id="auroraViolet" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCyan" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCenter" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradient for Text & Accents -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <clipPath id="card"><rect width="900" height="280" rx="22"/></clipPath>
    <clipPath id="wordClip"><rect x="42" y="148" width="680" height="64"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .title { font-weight: 800; font-size: 46px; fill: #F8FAFC; letter-spacing: -1.2px; }
    .word { font-weight: 800; font-size: 46px; fill: url(#textGrad); letter-spacing: -1.2px; opacity: 0; animation: cycle 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .w2 { animation-delay: 3s; }
    .w3 { animation-delay: 6s; }
    .w4 { animation-delay: 9s; }

    @keyframes cycle {
      0% { opacity: 0; transform: translateY(32px); filter: blur(4px); }
      4%, 22% { opacity: 1; transform: translateY(0); filter: blur(0); }
      27%, 100% { opacity: 0; transform: translateY(-32px); filter: blur(4px); }
    }

    .fade-up { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.22s; }
    .d3 { animation-delay: 0.36s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    .pulse { transform-origin: 58px 48px; animation: pulseRing 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    @keyframes pulseRing { 0% { transform: scale(1); opacity: 0.8; } 80%, 100% { transform: scale(3.4); opacity: 0; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .beam { animation: sweep 8s linear infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px) skewX(-20deg); } 100% { transform: translateX(1200px) skewX(-20deg); } }
  </style>

  <!-- Card Background -->
  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="#07070C"/>
    <rect width="900" height="280" fill="url(#dotGrid)"/>
    <rect width="900" height="280" fill="url(#auroraViolet)"/>
    <rect width="900" height="280" fill="url(#auroraCyan)"/>
    <rect width="900" height="280" fill="url(#auroraCenter)"/>
    <rect class="beam" x="0" y="0" width="180" height="280" fill="url(#textGrad)" opacity="0.04"/>
  </g>

  <!-- Glowing Border -->
  <rect x="0.75" y="0.75" width="898.5" height="278.5" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Status Pill -->
  <g class="fade-up">
    <rect x="42" y="32" width="340" height="32" rx="16" fill="#0E0D1B" stroke="#2E1065" stroke-width="1.2"/>
    <circle class="pulse" cx="58" cy="48" r="4" fill="#06B6D4"/>
    <circle cx="58" cy="48" r="4" fill="#06B6D4"/>
    <text x="72" y="53" class="mono" font-size="12" font-weight="600" fill="#38BDF8">OPEN TO WORK</text>
    <text x="175" y="53" class="mono" font-size="12" fill="#A5B4FC">· Flutter / Mobile &amp; Full Stack</text>
  </g>

  <!-- Headline -->
  <text x="42" y="128" class="sans title fade-up d1">I build software &amp; mobile apps for</text>

  <!-- Dynamic Animated Words -->
  <g clip-path="url(#wordClip)" class="fade-up d2">
    <text x="42" y="196" class="sans word w1">cross-platform Flutter &amp; Android.</text>
    <text x="42" y="196" class="sans word w2">real-time bus transit tracking (SABAS).</text>
    <text x="42" y="196" class="sans word w3">AI payment recovery agents.</text>
    <text x="42" y="196" class="sans word w4">clinic patient apps &amp; live queues.</text>
  </g>

  <!-- Whoami Terminal Line -->
  <g class="fade-up d3">
    <text x="42" y="246" class="mono" font-size="13.5" fill="#94A3B8">$ whoami <tspan fill="#F8FAFC" font-weight="600">Nikunj Kumar</tspan> — Flutter · Android · Node.js · React · PostgreSQL · AWS<tspan class="cursor" fill="#A855F7"> ▍</tspan></text>
  </g>

  <!-- Unique Iridescent Monogram Badge -->
  <g transform="translate(804, 32)">
    <rect width="52" height="52" rx="16" fill="#0E0D1B" stroke="url(#badgeGrad)" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="20" fill="url(#badgeGrad)" opacity="0.15"/>
    <text x="26" y="33" text-anchor="middle" class="sans" font-weight="900" font-size="20" fill="url(#textGrad)">NK</text>
  </g>
</svg>
