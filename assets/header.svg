<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Nikunj Kumar — Full Stack &amp; Mobile Application Developer">
  <defs>
    <!-- Constellation Dot Matrix -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#312E81" opacity="0.6"/>
      <circle cx="16" cy="16" r="0.8" fill="#4338CA" opacity="0.3"/>
    </pattern>

    <!-- Aurora Mesh Gradients -->
    <radialGradient id="auroraViolet" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCyan" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCenter" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.6"/>
    </linearGradient>

    <clipPath id="card"><rect width="900" height="280" rx="22"/></clipPath>
    <clipPath id="wordClip"><rect x="42" y="148" width="650" height="66"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    
    .title { font-weight: 800; font-size: 48px; fill: #F8FAFC; letter-spacing: -1.2px; }
    .word { font-weight: 800; font-size: 48px; fill: #38BDF8; letter-spacing: -1.2px; opacity: 0; animation: wordCycle 12s infinite; }
    .w2 { animation-delay: 3s; }
    .w3 { animation-delay: 6s; }
    .w4 { animation-delay: 9s; }

    @keyframes wordCycle {
      0% { opacity: 0; transform: translateY(36px); }
      4%, 22% { opacity: 1; transform: translateY(0); }
      27%, 100% { opacity: 0; transform: translateY(-36px); }
    }

    .pulse { transform-origin: 58px 48px; animation: ping 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.8; } 80%, 100% { transform: scale(3.2); opacity: 0; } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Card Background -->
  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="#07070C"/>
    <rect width="900" height="280" fill="url(#dotGrid)"/>
    <rect width="900" height="280" fill="url(#auroraViolet)"/>
    <rect width="900" height="280" fill="url(#auroraCyan)"/>
    <rect width="900" height="280" fill="url(#auroraCenter)"/>
  </g>

  <!-- Glowing Border -->
  <rect x="0.75" y="0.75" width="898.5" height="278.5" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Status Pill -->
  <g>
    <rect x="42" y="32" width="340" height="32" rx="16" fill="#0E0D1B" stroke="#2E1065" stroke-width="1.2"/>
    <circle class="pulse" cx="58" cy="48" r="4" fill="#06B6D4"/>
    <circle cx="58" cy="48" r="4" fill="#06B6D4"/>
    <text x="72" y="53" class="mono" font-size="12" font-weight="600" fill="#38BDF8">OPEN TO WORK</text>
    <text x="175" y="53" class="mono" font-size="12" fill="#A5B4FC">· SDE-1 / Full Stack &amp; Mobile</text>
  </g>

  <!-- Headline -->
  <text x="42" y="128" class="sans title">I build software &amp; systems powering</text>

  <!-- Dynamic Animated Words -->
  <g clip-path="url(#wordClip)">
    <text x="42" y="196" class="sans word w1">AI recovery agents.</text>
    <text x="42" y="196" class="sans word w2">technical interviews.</text>
    <text x="42" y="196" class="sans word w3">clinic queues &amp; POS.</text>
    <text x="42" y="196" class="sans word w4">cold outreach SaaS.</text>
  </g>

  <!-- Whoami Terminal Line -->
  <g>
    <text x="42" y="246" class="mono" font-size="13.5" fill="#94A3B8">$ whoami <tspan fill="#F8FAFC" font-weight="600">Nikunj Kumar</tspan> — Node.js · React · Flutter · Postgres · AWS<tspan class="cursor" fill="#A855F7"> ▍</tspan></text>
  </g>

  <!-- Unique Iridescent Monogram Badge -->
  <g transform="translate(804, 32)">
    <rect width="52" height="52" rx="16" fill="#0E0D1B" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="20" fill="#8B5CF6" opacity="0.15"/>
    <text x="26" y="34" text-anchor="middle" class="sans" font-weight="900" font-size="20" fill="#38BDF8">NK</text>
  </g>
</svg>
